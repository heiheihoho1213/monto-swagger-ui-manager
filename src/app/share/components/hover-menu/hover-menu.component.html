<div [matMenuTriggerFor]="menu" #menuTrigger="matMenuTrigger" (click)="openMenu(menuTrigger)">
  <ng-content select="[trigger]"></ng-content>
</div>

<mat-menu #menu="matMenu" [hasBackdrop]="false" [class]="menuClass">
  <ng-template matMenuContent>
    <div appStopClick [stopPropagation]="!closeOnContentClick" (click)="openMenu(menuTrigger)">
      <ng-content select="[menuContent]"></ng-content>
    </div>
  </ng-template>
</mat-menu>
